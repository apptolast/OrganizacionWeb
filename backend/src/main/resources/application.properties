spring.application.name=organization-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
app.auth.username=${APP_AUTH_USERNAME}
app.auth.password=${APP_AUTH_PASSWORD}
app.public-origin=${APP_PUBLIC_ORIGIN:}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-trailing-tokens=true
