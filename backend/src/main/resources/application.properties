spring.application.name=organization-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
app.auth.username=${APP_AUTH_USERNAME}
app.auth.password=${APP_AUTH_PASSWORD}
app.public-origin=${APP_PUBLIC_ORIGIN:}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-trailing-tokens=true
app.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:false}
app.publisher.rabbitmq.host=${RABBITMQ_HOST:}
app.publisher.rabbitmq.port=${RABBITMQ_PORT:5672}
app.publisher.rabbitmq.username=${RABBITMQ_USERNAME:}
app.publisher.rabbitmq.password=${RABBITMQ_PASSWORD:}
app.publisher.rabbitmq.vhost=${RABBITMQ_VHOST:/}
app.max-active-projects=${APP_MAX_ACTIVE_PROJECTS:3}
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
# Conectores (features 27 y 28). Sin APP_CONNECTOR_KEY los conectores quedan deshabilitados y sus
# rutas responden 503; con una clave presente pero mal formada la aplicacion no arranca.
app.connectors.key=${APP_CONNECTOR_KEY:}
app.connectors.key-previous=${APP_CONNECTOR_KEY_PREVIOUS:}
# Valvula del perfil de extremo a extremo del calendario externo. Nunca en produccion. No gobierna
# el envio de webhooks de la feature 25, que bloquea las direcciones privadas siempre.
app.connectors.allow-private-addresses=${APP_CONNECTORS_ALLOW_PRIVATE_ADDRESSES:false}
app.github.api-base=${APP_GITHUB_API_BASE:https://api.github.com}
