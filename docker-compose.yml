services:
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_DB: organization
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d organization']
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      OUTBOX_PUBLISHER_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/organization
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_PUBLIC_ORIGIN: http://127.0.0.1:${WEB_PORT:-8080}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?Set APP_AUTH_USERNAME in .env}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?Set APP_AUTH_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      - backend
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
