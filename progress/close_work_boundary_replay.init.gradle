// Diagnostic replay only. The feature16 report and global build stay unchanged.
allprojects {
    afterEvaluate { project ->
        def pit = project.extensions.findByName('pitest')
        if (pit != null) {
            pit.targetClasses.set(['com.apptolast.organization.domain.OutboxMessage'] as Set)
            pit.mutators.set(['CONDITIONALS_BOUNDARY'] as Set)
            pit.reportDir.set(project.layout.buildDirectory.dir('reports/pitest-close-work-boundary-replay'))
        }
    }
}
