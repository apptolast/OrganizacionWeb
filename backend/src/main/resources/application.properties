spring.application.name=organization-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
app.auth.username=${APP_AUTH_USERNAME}
app.auth.password=${APP_AUTH_PASSWORD}
app.public-origin=${APP_PUBLIC_ORIGIN:}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-trailing-tokens=true
app.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:false}
app.publisher.rabbitmq.host=${RABBITMQ_HOST:}
app.publisher.rabbitmq.port=${RABBITMQ_PORT:5672}
app.publisher.rabbitmq.username=${RABBITMQ_USERNAME:}
app.publisher.rabbitmq.password=${RABBITMQ_PASSWORD:}
app.publisher.rabbitmq.vhost=${RABBITMQ_VHOST:/}
app.max-active-projects=${APP_MAX_ACTIVE_PROJECTS:3}
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
