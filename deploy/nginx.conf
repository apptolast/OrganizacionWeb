upstream organizationweb_api {
    zone organizationweb_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server backend:8080 resolve;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 204; }
    location = /api/v1/me/import {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://organizationweb_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }
    location = /api/v1/me/import/preview {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://organizationweb_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }
    # The subscription token travels in the path: it must never reach an access log.
    location /calendar/ {
        access_log off;
        # El backend ya emite estas tres (hallazgo A8): sin ocultarlas, el add_header del server
        # las añadiría una segunda vez y el feed respondería "nosniff, nosniff".
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://organizationweb_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }
    location /api/ {
        proxy_pass http://organizationweb_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
