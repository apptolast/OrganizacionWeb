name: Prueba de mutación

# Campaña completa de mutación: `harness verify` es init más la mutación de
# `harness.config.json`. Es cara en CPU por diseño (reejecuta la suite por cada
# mutante), así que corre de noche y a petición, no en cada push.
#
# Esto NO relaja la puerta de cierre del proceso: `docs/verification.md` y
# `CHECKPOINTS.md` C7 siguen exigiendo mutación por encima del umbral antes de
# marcar una feature `done`, ejecutada por `mutation_tester` sobre el alcance de
# esa feature. Este workflow es la red de seguridad periódica sobre todo el
# repositorio, no el sustituto de aquella.

# ── POR QUÉ AQUÍ NO HAY CRON, 11 de septiembre de 2026 ──────────────────────
#
# Había uno diario ("0 2 * * *") y NUNCA completó una campaña. Los runs del 7,
# 8 y 9 de septiembre duran exactamente 4 h 00 m: son el `timeout-minutes: 240`
# de abajo matándolos. Medido en el log del run 34322164783: init verde en
# 10 min 39 s, PIT calculó cobertura en 470 s, creó 254 unidades de mutación a
# las 07:24:57 y siguió analizando 3 h 41 min 26 s sin terminar el backend. La
# campaña de frontend no llegó a arrancar ni una sola vez.
#
# No es un timeout mal puesto: NO CABE. Doce de los ámbitos documentados en
# progress/ suman 6 h 37 m ellos solos, y el techo duro de un job hospedado son
# 360 min. Subir el timeout sólo cambia "cancelado a las 4 h" por "cancelado a
# las 6 h".
#
# Tampoco vale trocear por ámbitos con nombre, que es la salida que parece
# obvia: está medido en progress/medicion_ambito_mutacion.md que el objetivo
# vacío muta 456 clases y la unión de los ámbitos con nombre sólo 308. Esa
# matriz dejaría 148 clases sin mutar —Project, Task, CreateTaskUseCase,
# ValidationException entre ellas— y encima en verde. Poner el semáforo en
# verde midiendo menos es justo lo que CLAUDE.md prohíbe.
#
# Así que la red de seguridad queda A PETICIÓN, y se dice en voz alta en vez de
# fallar cada noche hasta que nadie la mire. La puerta que de verdad cierra una
# feature no es ésta: es la mutación POR FEATURE que exige CHECKPOINTS.md C7,
# ejecutada por `mutation_tester` sobre el ámbito de esa feature, y sigue viva.
#
# PARA DEVOLVERLE EL CRON hace falta antes trocear de verdad: partición mecánica
# del universo (`-PmutationShard=k/N`), que preserva la cobertura por
# construcción en vez de por revisión humana, más un job de veredicto que se
# ponga rojo si falta una clase. Diseñado y verificado, sin aplicar. No vuelvas
# a poner un cron aquí sin eso: volvería a morir cada noche.

on:
  workflow_dispatch:

permissions:
  contents: read

# Grupo propio y sin cancelación: una campaña nocturna no debe morir porque
# alguien empuje a main mientras corre.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: node scripts/project.mjs install
      - run: node .harness/harness.mjs verify
